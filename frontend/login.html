<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Smart Event Finder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<nav class="navbar" id="main-navbar">
  <div class="container">
    <a href="index.html" class="brand">Smart<span class="dot">Event</span>Finder</a>
    <ul class="nav-links"></ul>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to bookmark, register and track your events.</p>

    <div class="role-hint">Demo: admin@eventfinder.com / Admin@123 (admin) · rohan.mehta@example.com / User@123 (user)</div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <p class="form-error" id="form-error"></p>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
