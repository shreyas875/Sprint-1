<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Smart Event Finder</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<nav class="navbar" id="main-navbar">
  <div class="container">
    <a href="index.html" class="brand">Smart<span class="dot">Event</span>Finder</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Explore Events</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="my-events.html">My Events</a></li>
      <li><a href="saved-events.html">Saved</a></li>
    </ul>
    <div class="nav-actions" id="nav-actions"></div>
    <button class="hamburger" id="hamburger-btn"><span></span><span></span><span></span></button>
  </div>
</nav>

<main class="container section">
  <div class="section-head"><h2>My Profile</h2></div>

  <div class="profile-layout">
    <div class="profile-card">
      <div class="avatar-lg" id="profile-avatar">U</div>
      <h3 id="profile-name">—</h3>
      <p id="profile-email">—</p>
      <p class="mt-8" id="profile-role"></p>
    </div>

    <div>
      <div class="settings-card">
        <h3>Personal Information</h3>
        <form id="profile-form">
          <div class="form-row">
            <div class="form-group">
              <label for="p-name">Full Name</label>
              <input type="text" id="p-name" required>
            </div>
            <div class="form-group">
              <label for="p-phone">Phone</label>
              <input type="tel" id="p-phone">
            </div>
          </div>
          <div class="form-group">
            <label for="p-city">Preferred Location</label>
            <select id="p-city">
              <option value="">Select city</option>
              <option>Mumbai</option>
              <option>Navi Mumbai</option>
              <option>Pune</option>
              <option>Bengaluru</option>
              <option>Delhi</option>
              <option>Hyderabad</option>
              <option>Chennai</option>
              <option>Kolkata</option>
              <option>Ahmedabad</option>
              <option>Jaipur</option>
            </select>
          </div>
          <div class="form-group">
            <label>Interests</label>
            <div class="checkbox-pill-group" id="interests-container"></div>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>

      <div class="settings-card">
        <h3>Update Password</h3>
        <form id="password-form">
          <div class="form-row">
            <div class="form-group">
              <label for="current-password">Current Password</label>
              <input type="password" id="current-password" required>
            </div>
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input type="password" id="new-password" required minlength="6">
            </div>
          </div>
          <p class="form-error" id="password-error"></p>
          <button type="submit" class="btn btn-outline">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="bottom-bar">© 2026 Smart Event Finder. All rights reserved.</div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
