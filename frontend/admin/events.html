<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Events — Admin — Smart Event Finder</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-brand">⚡ Admin Panel</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="events.html" class="active">🎟️ Events</a>
    <a href="users.html">👥 Users</a>
    <a href="registrations.html">📋 Registrations</a>
    <a href="../index.html">↩ Back to Site</a>
  </aside>

  <main class="admin-main">
    <div class="admin-toolbar">
      <h1 style="margin:0;">Manage Events</h1>
      <div class="flex gap-12">
        <button class="btn btn-primary" id="add-event-btn">+ Add Event</button>
        <div class="nav-actions" id="nav-actions"></div>
      </div>
    </div>

    <div class="admin-table-wrapper">
      <table class="admin-table">
        <thead>
          <tr><th>Image</th><th>Title</th><th>Category</th><th>City</th><th>Date</th><th>Price</th><th>Seats</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="events-table-body">
          <tr><td colspan="9">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add/Edit Event Modal -->
<div class="modal-overlay" id="event-modal-overlay">
  <div class="modal-box">
    <h2 id="event-modal-title">Add Event</h2>
    <form id="event-form">
      <input type="hidden" id="event-id">
      <div class="form-group">
        <label for="ev-title">Event Name</label>
        <input type="text" id="ev-title" required>
      </div>
      <div class="form-group">
        <label for="ev-description">Description</label>
        <textarea id="ev-description" rows="3"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-category">Category</label>
          <select id="ev-category" required></select>
        </div>
        <div class="form-group">
          <label for="ev-type">Event Type</label>
          <select id="ev-type">
            <option value="OFFLINE">Offline</option>
            <option value="ONLINE">Online</option>
            <option value="HYBRID">Hybrid</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-organizer">Organizer Name</label>
          <input type="text" id="ev-organizer">
        </div>
        <div class="form-group">
          <label for="ev-organizer-email">Organizer Email</label>
          <input type="email" id="ev-organizer-email">
        </div>
      </div>
      <div class="form-group">
        <label for="ev-venue">Venue</label>
        <input type="text" id="ev-venue">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-address">Address</label>
          <input type="text" id="ev-address">
        </div>
        <div class="form-group">
          <label for="ev-city">City</label>
          <input type="text" id="ev-city" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-latitude">Latitude</label>
          <input type="number" step="any" id="ev-latitude">
        </div>
        <div class="form-group">
          <label for="ev-longitude">Longitude</label>
          <input type="number" step="any" id="ev-longitude">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-date">Event Date</label>
          <input type="date" id="ev-date" required>
        </div>
        <div class="form-group">
          <label for="ev-status">Status</label>
          <select id="ev-status">
            <option value="PUBLISHED">Published</option>
            <option value="DRAFT">Draft</option>
            <option value="CANCELLED">Cancelled</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-start-time">Start Time</label>
          <input type="time" id="ev-start-time">
        </div>
        <div class="form-group">
          <label for="ev-end-time">End Time</label>
          <input type="time" id="ev-end-time">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="ev-price">Price (₹)</label>
          <input type="number" min="0" step="0.01" id="ev-price" value="0">
        </div>
        <div class="form-group">
          <label for="ev-capacity">Capacity</label>
          <input type="number" min="1" id="ev-capacity" required>
        </div>
      </div>
      <div class="form-group">
        <label for="ev-image">Image URL</label>
        <input type="url" id="ev-image" placeholder="https://...">
      </div>
      <p class="form-error" id="event-form-error"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancel-event-modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-event-btn">Save Event</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/common.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
